    <rect x="172" y="872" width="22" height="22" rx="5" class="merge" />
    <text x="204" y="888">Isolated merge</text>
    <rect x="342" y="872" width="22" height="22" rx="5" class="mile" />
    <text x="374" y="888">Runnable React milestone</text>
