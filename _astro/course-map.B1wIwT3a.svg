<svg xmlns="http://www.w3.org/2000/svg" width="740" height="942" viewBox="-20 -20 740 942" role="img" aria-labelledby="title desc">
  <title id="title">Course map: Build your own React</title>
  <desc id="desc">Fourteen isolated lessons in a left column feed eight milestones that step down to the right. Elements and JSX, Fiber tree and DOM host lead to First paint (mount only). Keyed diff leads to Reconciler (update, delete). Hooks list and Update queue merge into the State engine (useState, no tree), which leads to Stateful React (setState, bailouts). Effects and refs, Context stack and DOM events lead to Sync React (commit phases). Lanes and Scheduler merge into the Priority loop (interruptible work), which leads to Concurrent (time slicing). Thenables leads to Suspense (use(promise)). Async actions leads to React 19 (actions, Activity). DevTools hook leads to the finale, mini-react with DevTools. Each milestone also builds on the one above it.</desc>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#0d5c5e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 15px; fill: #0a3d3e; }
    .leaves rect, .lesson { fill: #fdf6e9; stroke: #0a3d3e; stroke-width: 1.5; }
    .leaves text { text-anchor: middle; }
    .merges rect, .merge { fill: #bfe6e0; stroke: #0d5c5e; stroke-width: 2; }
    .milestones rect, .mile { fill: #0b6e6e; stroke: #0a3d3e; stroke-width: 2; }
    .merges text, .milestones text { text-anchor: middle; }
    .t { font-weight: 700; }
    .s { font-size: 13px; }
    .milestones text { fill: #fff; }
    .milestones .final rect { stroke-width: 4; }
    .lines path { fill: none; stroke: #0d5c5e; stroke-width: 1.5; }
    .lines .arrow { marker-end: url(#head); }
  </style>
