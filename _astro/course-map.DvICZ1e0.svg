<svg xmlns="http://www.w3.org/2000/svg" width="740" height="942" viewBox="-20 -20 740 942" role="img" aria-labelledby="title desc">
  <title id="title">Mapa del curso: Construye tu propio React</title>
  <desc id="desc">Catorce lecciones aisladas en una columna a la izquierda alimentan ocho hitos que bajan en escalera hacia la derecha. Elementos y JSX, Árbol de fibers y Host del DOM llevan a First paint (solo montaje). Diff con keys lleva a Reconciliador (actualizar, eliminar). Lista de hooks y Cola de actualizaciones se fusionan en el Motor de estado (useState, sin árbol), que lleva a React con estado (setState, bailouts). Efectos y refs, Pila de contexto y Eventos del DOM llevan a React síncrono (fases de commit). Lanes y Scheduler se fusionan en el Bucle de prioridades (trabajo interrumpible), que lleva a Concurrent (time slicing). Thenables lleva a Suspense (use(promise)). Acciones asíncronas lleva a React 19 (acciones, Activity). Hook de DevTools lleva al final, mini-react con DevTools. Cada hito se apoya además en el que tiene encima.</desc>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#0d5c5e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 15px; fill: #0a3d3e; }
    .leaves rect, .lesson { fill: #fdf6e9; stroke: #0a3d3e; stroke-width: 1.5; }
    .leaves text { text-anchor: middle; }
    .merges rect, .merge { fill: #bfe6e0; stroke: #0d5c5e; stroke-width: 2; }
    .milestones rect, .mile { fill: #0b6e6e; stroke: #0a3d3e; stroke-width: 2; }
    .merges text, .milestones text { text-anchor: middle; }
    .t { font-weight: 700; }
    .s { font-size: 13px; }
    .milestones text { fill: #fff; }
    .milestones .final rect { stroke-width: 4; }
    .lines path { fill: none; stroke: #0d5c5e; stroke-width: 1.5; }
    .lines .arrow { marker-end: url(#head); }
  </style>
